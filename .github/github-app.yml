instructions: |
  Own Pal Event Director development and deployment locally on IMOUTO as one continuous workflow.

  Standing authorization:
  - The user authorizes routine PED investigation, source fixes, existing tests, packaging, commits, non-force pushes to origin/main, deployment, and dedicated-server restarts. Do not ask for approval again for each routine iteration.
  - Restart or shut down the IMOUTO dedicated server whenever needed without asking again, including without waiting for a player-disconnect confirmation. Prefer a graceful dedicated-only shutdown when available.
  - Provide complete, clearly conditional in-game command sequences when user participation is needed. Do not ask them to approve routine restarts or confirm every diagnostic operation.
  - Pause for conflicting user changes or actions outside this authorized scope rather than broadening the scope silently.

  Workspace and target boundaries:
  - Confirm the local machine is IMOUTO before any server operation. Use the current workspace checkout and preserve existing user changes.
  - Only target D:\SteamLibrary\steamapps\common\PalServer. Use its installed PED preparation and launcher workflow, including -ValidateOnly, and game port 8213. Never use Steam Play to launch the server.
  - Never operate on MIKO's live server, launchers, services, or processes. The old Z:\Repositories\PalEventDirector path is a MIKO-hosted share, not a local checkout; do not use it.
  - Never modify or terminate the sibling Palworld client installation or unrelated applications.
  - The disposable world is already imported. Do not rerun its importer. Preserve interrupted events as recovery_required and never replay them.

  Gameplay testing and recovery:
  - The user authorizes an opt-in headless startup qualification loop on this disposable IMOUTO server: implement, run real bounded engine scenarios, inspect evidence, fix, build/deploy and repeat until genuine client-dependent input is needed. Use the installed launcher's explicit StartupTest mode and a fresh durable test run, not fake player/admin identities or normal online-guild event admission. Normal launches must not auto-run mutation tests.
  - Startup tests have their own journals and owned-entity ledger. Preserve request16 and normal event recovery unchanged. Never replay an interrupted test, blindly repeat a native fault on the same artifact, or arm new mutations while a prior test has uncertain owned entities. Report real observations as PASS/FAIL/BLOCKED; handles/action returns alone are not gameplay proof.
  - The user explicitly approved a restricted one-NPC faster-AI laboratory trial under stock normal networked-sphere capture only, with no legacy, scripted, or third-party capture/ownership-transfer actions during that trial. Bind this restriction to the dedicated cadence-test contract; it is not permission for a general transferable-encounter lease. Require the qualified synchronous pre-transfer barrier, exact old component ownership, game-thread confirmation, generation revocation and verified restoration/disposal before accepting cleanup.
  - The current dedicated target is build 25080279. The bare RequestIncidentInvaderEnemy_BP experiment is retired: it spawned enemies without InvaderInfo and later crashed native cleanup. The repaired single-base control initializes the real APalInvaderInfo through deferred spawning and native BeginPlay; Palworld must own incident registration and wave handling.
  - The user explicitly chose simultaneous custom-spawn attacks for all-bounty, not a sequential native queue. Use PED-owned stock bounty NPCs, interleaved bounded spawn batches and base-local AI without creating native invasion incidents, duplicating InvaderInfo, changing native maps or chasing a distant player. Other profiles retain their native routes.
  - Sky, water and terrain-isolated bases are legitimate targets, not evidence of an engine fault. The user approved spawning on a verified safe surface inside the intended base when an approach is unavailable. Keep the fallback bounded, per-base and reported; never invent a floor/path, spawn unsupported ground NPCs into air/water, teleport existing attackers, or widen a failed ground ray.
  - Custom ownership requires the exact native instance/player-ID pair, character, world and original actor identity. Capture-in-progress and inactivity pause participation; completed capture revokes PED ownership. Cleanup may affect only still-owned PED spawns. A despawn request, inactive flag or missing handle alone is not completion; retain uncertain outcomes, poll pending completion without repeating the request, and never automatically replay interrupted cleanup after a restart.
  - In-game invasion commands must not require a manually completed stepped preflight. For native profiles, authorized admins delegate gameplay policy to Palworld: log visitor/incident occupancy, busy/pathfinding/cooldown, world-enable and base availability/ignore flags, but do not use them as PED start vetoes. Ordinary users and schedules retain their configured policies. Native raid admission policy does not gate the separate custom-assault backend.
  - Keep authentication, supported-runtime/call safety, valid exact targets, bounded work, durable recovery and truthful lifecycle correlation. Do not count an already-existing native group as success for a new request. Do not delete native incident entries or rewrite flags/timers to manufacture acceptance.
  - Detailed group/worker/spawn/path/signature inspection remains available explicitly; it must not be an extra unlock before an admin start. An admin all-target request must not depend on the first base accepting before other requested bases are submitted; stop further submissions on an actual native fault.
  - Capture flushed, privacy-safe native before/after breadcrumbs during ordinary start and dispatch operations. Keep the oversized by-value GetOptionWorldSettings getter prohibited.
  - The isolated stepped diagnostic is optional, never an unlock ceremony. If used, execute one exact ExpectedStep at a time and inspect its response and markers before advancing; do not bulk-run, skip, or retry failed steps.
  - On a native error, missing after-marker, or crash, stop further native attempts, preserve private evidence, investigate, fix, build a new attested package, deploy while stopped, and restart. Never hand-edit the hash-attested live package.
  - When stopping the server, recheck executable paths and current process identities and stop only the verified dedicated-server PIDs. Do not kill processes by name.
  - Never force-push, print credentials or player UIDs, dump server settings, or publish dumps, saves, settings, or raw player-bearing logs. Do not request or repeat the configured admin password.
  - Use Windows PowerShell 5.1-compatible commands. Flatten ConvertFrom-Json arrays with a separate ForEach-Object stage before projecting or counting them.
